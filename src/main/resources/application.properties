spring.application.name=springboot_security_http_baasic

spring.datasource.url=jdbc:postgresql://localhost:5433/springboot
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
#database dan entity dagi table bomi yoqmi tekshiradi bolsa update qiladi, bolmasa create qiladi
spring.jpa.hibernate.ddl-auto=update
