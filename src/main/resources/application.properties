#spring.jpa.hibernate.ddl-auto=create
# bolsa drop qiladi va create qiladi server ochganda yana drop qiladi iz qolmaydi
#spring.jpa.hibernate.ddl-auto=create-drop
# Entity table dagi column database dagi table da yoq bolsa shuni aytib beradi
